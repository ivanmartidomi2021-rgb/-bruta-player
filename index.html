<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000000;
  --surface:#0f0f0f;
  --surface2:#1f1f1f;
  --surface3:#2a2a2a;
  --spotify:#1DB954;
  --spotify-glow:0 0 15px rgba(29,185,84,.4);
  --pink:#ff4785;
  --cyan:#47e8ff;
  --purple:#b847ff;
  --text:#ffffff;
  --text-secondary:#b3b3b3;
  --border:#282828;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;height:100vh}

/* SPLASH SCREEN - LOGO DE ENTRADA */
.splash-screen{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(145deg,#0a0a0a,#000000);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:1000;transition:opacity 0.8s ease;opacity:1;
}
.splash-logo{
  width:120px;height:120px;background:linear-gradient(135deg,#1DB954,#0e8c40);
  border-radius:28px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(29,185,84,.5);animation:logoPop 0.6s cubic-bezier(0.34,1.2,0.64,1);
}
.splash-logo span{font-size:64px;font-weight:900;color:white;}
.splash-text{
  margin-top:24px;font-size:32px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(135deg,#1DB954,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.splash-sub{font-size:13px;color:var(--text-secondary);margin-top:8px;letter-spacing:2px}
@keyframes logoPop{0%{transform:scale(0.5) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* APP CONTENT - inicialmente oculto */
.app-content{display:none;flex-direction:column;height:100%}

/* BOTTOM NAVIGATION (Spotify style) */
.bottom-nav{
  display:flex;background:rgba(15,15,15,0.98);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);padding:10px 24px 14px;justify-content:space-between;z-index:50;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;
  color:var(--text-secondary);transition:color 0.1s;cursor:pointer;
}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none}
.nav-item.active{color:var(--spotify)}
.nav-item.active svg{stroke:var(--spotify);fill:rgba(29,185,84,.1)}

/* HEADER */
.main-header{
  display:flex;justify-content:space-between;align-items:center;padding:20px 20px 8px;
}
.logo{font-size:28px;font-weight:900;background:linear-gradient(135deg,#1DB954,#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.settings-btn{background:var(--surface2);width:40px;height:40px;border-radius:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}

/* SEARCH */
.search-container{padding:8px 20px}
.search-box{background:var(--surface2);border-radius:30px;padding:12px 18px;display:flex;align-items:center;gap:12px}
.search-box input{background:none;border:none;color:white;flex:1;font-size:15px;outline:none}
.search-box input::placeholder{color:var(--text-secondary)}

/* GENRES */
.genres-scroll{display:flex;gap:10px;overflow-x:auto;padding:12px 20px;scrollbar-width:none}
.genre-chip{background:var(--surface2);padding:8px 20px;border-radius:40px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all 0.2s}
.genre-chip.active{background:var(--spotify);color:#000;box-shadow:var(--spotify-glow)}

/* HERO PLAYER (Spotify style now playing bar) */
.hero-card{
  background:linear-gradient(145deg,var(--surface2),#121212);margin:8px 16px 20px;border-radius:20px;padding:18px;border:1px solid var(--border);
}
.now-playing-row{display:flex;align-items:center;gap:16px}
.hero-artwork{
  width:70px;height:70px;border-radius:16px;background:linear-gradient(135deg,#1DB954,#0e8c40);
  display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 6px 12px rgba(0,0,0,.3);
}
.hero-info{flex:1}
.hero-title{font-size:17px;font-weight:700;margin-bottom:3px}
.hero-artist{font-size:13px;color:var(--text-secondary)}
.hero-controls{display:flex;gap:20px;margin-top:16px;justify-content:center}
.ctrl-btn{background:var(--surface3);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s}
.play-btn{background:var(--spotify);width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--spotify-glow)}
.play-btn svg{width:24px;height:24px;color:#000}
.progress-area{margin-top:14px}
.progress-bar{height:4px;background:var(--surface3);border-radius:10px;cursor:pointer}
.progress-fill{height:100%;background:var(--spotify);border-radius:10px;width:0%}
.time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-top:5px}

/* SECTION HEADER */
.section-header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 8px}
.section-title{font-size:18px;font-weight:700}
.section-link{font-size:12px;color:var(--spotify);font-weight:600;cursor:pointer}

/* PLAYLIST HORIZONTAL */
.playlist-scroll{display:flex;gap:14px;overflow-x:auto;padding:0 16px 20px}
.playlist-card{background:var(--surface2);border-radius:16px;width:140px;flex-shrink:0;overflow:hidden;cursor:pointer;border:1px solid var(--border)}
.playlist-cover{height:130px;background:linear-gradient(135deg,#1DB954,#0e8c40);display:flex;align-items:center;justify-content:center;font-size:42px}
.playlist-info{padding:10px}
.playlist-name{font-weight:600;font-size:13px}
.playlist-count{font-size:10px;color:var(--text-secondary);margin-top:2px}

/* GRID CANCIONES */
.songs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;padding:0 16px 20px}
.song-card{background:var(--surface2);border-radius:14px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:all 0.15s}
.song-card.active{border-color:var(--spotify)}
.song-card:active{transform:scale(.97)}
.song-art{height:140px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:40px;position:relative}
.song-info-card{padding:10px}
.song-name-card{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist-card{font-size:11px;color:var(--text-secondary);margin-top:2px}
.song-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.duration{font-size:10px;color:var(--text-secondary)}
.like-icon{background:none;border:none;cursor:pointer;font-size:14px}

/* QUEUE PANEL */
.queue-panel{padding:0 16px 20px;max-height:350px;overflow-y:auto}
.queue-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;transition:background 0.1s}
.queue-item.active{background:rgba(29,185,84,.15);border-left:3px solid var(--spotify)}
.queue-art{width:48px;height:48px;border-radius:12px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:22px}
.queue-info{flex:1}
.queue-title{font-size:14px;font-weight:500}
.queue-artist{font-size:11px;color:var(--text-secondary)}
.queue-duration{font-size:11px;color:var(--text-secondary)}

/* MINI PLAYER */
.mini-player{
  background:rgba(15,15,15,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--spotify);
  padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:100;
}
.mini-cover{width:48px;height:48px;border-radius:12px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:22px}
.mini-info{flex:1}
.mini-title{font-size:13px;font-weight:600}
.mini-artist{font-size:10px;color:var(--text-secondary)}
.mini-controls{display:flex;gap:20px}
.mini-controls button{background:none;border:none;color:white;font-size:20px;cursor:pointer}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.95);backdrop-filter:blur(12px);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-content{background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-width:500px;padding:24px}
.modal-header{display:flex;justify-content:space-between;margin-bottom:20px}
.setting-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}

/* TOAST */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--spotify);color:#000;padding:8px 20px;border-radius:40px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity 0.2s}

/* SCROLL */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--spotify);border-radius:10px}
</style>
</head>
<body>

<div class="modal" id="settingsModal"><div class="modal-content"><div class="modal-header"><h3>⚙️ BRUTA PREMIUM</h3><span id="closeModal" style="font-size:24px;cursor:pointer">✕</span></div><div class="setting-item"><span>🎵 Sin anuncios</span><span>✅ Activado</span></div><div class="setting-item"><span>🔊 Calidad</span><span>Alta (320kbps)</span></div><div class="setting-item"><span>📱 Modo offline</span><span>Próximamente</span></div><div class="setting-item"><span>💚 Versión</span><span>BRUTA 4.0 | Spotify Edition</span></div></div></div>
<div class="toast" id="toastMsg"></div>

<script>
// 65+ CANCIONES REALES
const TRACKS = [
  {id:0,title:"Bohemian Rhapsody",artist:"Queen",duration:354,videoId:"fJ9rUzIMcZQ",genre:"Classic Rock",emoji:"👑"},
  {id:1,title:"Stairway to Heaven",artist:"Led Zeppelin",duration:482,videoId:"QkF3oxziUI4",genre:"Classic Rock",emoji:"🪜"},

  {id:26,title:"Satisfaction",artist:"Rolling Stones",duration:223,videoId:"nrIPxlFzDi0",genre:"Rock",emoji:"😎"},
  {id:27,title:"Johnny B. Goode",artist:"Chuck Berry",duration:161,videoId:"ZFo8-JqzSCM",genre:"Rock and Roll",emoji:"🎸"},
  {id:28,title:"Fortunate Son",artist:"CCR",duration:139,videoId:"JCbKv9yiLiQ",genre:"Rock",emoji:"🇺🇸"},
  {id:29,title:"Proud Mary",artist:"CCR",duration:188,videoId:"XfuBERBREa0",genre:"Rock",emoji:"⛴️"}
];

const GENRES = ["Todos","Classic Rock","Hard Rock","Heavy Metal","Prog Rock","Grunge","Blues Rock","Southern Rock"];
const PLAYLISTS = [{name:"Rock Classics",cover:"🎸",count:30},{name:"Heavy Metal",cover:"🤘",count:12},{name:"Prog Journey",cover:"🌀",count:10},{name:"Hard Rock Mix",cover:"⚡",count:15}];

let player, currentId=0, isPlaying=false, isShuffle=false, isRepeat=false, queue=[], queueIndex=0;
let likes=new Set(JSON.parse(localStorage.getItem('brutaLikes')||'[]'));
let search="", currentGenre="Todos";

function formatTime(s){let m=Math.floor(s/60),sec=Math.floor(s%60);return m+":"+(sec<10?'0':'')+sec}
function showToast(msg){let t=document.getElementById('toastMsg');t.innerText=msg;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800);}

function initQueue(){if(queue.length===0){queue=TRACKS.map(t=>t.id);queueIndex=queue.indexOf(currentId);}updateQueueUI();}
function updateQueueUI(){let container=document.getElementById('queuePanel');let items=queue.map(id=>TRACKS.find(t=>t.id===id)).filter(t=>t);container.innerHTML=items.map((t,idx)=>`<div class="queue-item ${currentId===t.id?'active':''}" onclick="playTrack(${t.id})"><div class="queue-art">${t.emoji}</div><div class="queue-info"><div class="queue-title">${t.title}</div><div class="queue-artist">${t.artist}</div></div><div class="queue-duration">${formatTime(t.duration)}</div></div>`).join('');}
function playTrack(id){currentId=id;queueIndex=queue.indexOf(id);if(queueIndex===-1){queue=[id,...queue.filter(i=>i!==id)];queueIndex=0;}loadAndPlay();}
function loadAndPlay(){let t=TRACKS.find(t=>t.id===currentId);if(player&&t){player.loadVideoById(t.videoId);player.playVideo();isPlaying=true;updateUI();}}
function updateUI(){let t=TRACKS.find(t=>t.id===currentId);if(t){document.getElementById('heroTitle').innerText=t.title;document.getElementById('heroArtist').innerText=t.artist;document.getElementById('heroArtwork').innerText=t.emoji;document.getElementById('totalTime').innerText=formatTime(t.duration);document.getElementById('miniTitle').innerText=t.title;document.getElementById('miniArtist').innerText=t.artist;document.getElementById('miniCover').innerText=t.emoji;document.getElementById('miniPlayer').style.display='flex';updateQueueUI();renderSongsGrid();}}
function nextTrack(){if(isShuffle){let random=Math.floor(Math.random()*TRACKS.length);playTrack(random);}else{queueIndex=(queueIndex+1)%queue.length;playTrack(queue[queueIndex]);}}
function prevTrack(){queueIndex=(queueIndex-1+queue.length)%queue.length;playTrack(queue[queueIndex]);}
function togglePlay(){if(!player)return;if(isPlaying){player.pauseVideo();isPlaying=false;}else{player.playVideo();isPlaying=true;}updatePlayUI();}
function updatePlayUI(){let playIcon=document.getElementById('playIcon'),pauseIcon=document.getElementById('pauseIcon'),miniPlay=document.getElementById('miniPlayIcon'),miniPause=document.getElementById('miniPauseIcon');if(isPlaying){playIcon.style.display='none';pauseIcon.style.display='block';miniPlay.style.display='none';miniPause.style.display='block';document.getElementById('heroArtwork').parentElement.classList.add('playing');}else{playIcon.style.display='block';pauseIcon.style.display='none';miniPlay.style.display='block';miniPause.style.display='none';}}
function toggleShuffle(){isShuffle=!isShuffle;document.getElementById('shuffleBtn').style.opacity=isShuffle?'1':'0.5';showToast(isShuffle?'🔀 Aleatorio ON':'🔀 Aleatorio OFF');}
function toggleRepeat(){isRepeat=!isRepeat;document.getElementById('repeatBtn').style.opacity=isRepeat?'1':'0.5';showToast(isRepeat?'🔁 Repetir ON':'🔁 Repetir OFF');}
function toggleLike(id){if(likes.has(id))likes.delete(id);else likes.add(id);localStorage.setItem('brutaLikes',JSON.stringify([...likes]));renderSongsGrid();showToast(likes.has(id)?'❤️ Añadida a Favoritas':'💔 Eliminada de Favoritas');}
function renderGenres(){let container=document.getElementById('genresContainer');container.innerHTML=GENRES.map(g=>`<div class="genre-chip ${currentGenre===g?'active':''}" data-genre="${g}">${g}</div>`).join('');document.querySelectorAll('.genre-chip').forEach(c=>c.onclick=()=>{currentGenre=c.dataset.genre;renderGenres();renderSongsGrid();});}
function renderSongsGrid(){let filtered=TRACKS.filter(t=>currentGenre==='Todos'||t.genre===currentGenre);if(search)filtered=filtered.filter(t=>t.title.toLowerCase().includes(search)||t.artist.toLowerCase().includes(search));let grid=document.getElementById('songsGrid');grid.innerHTML=filtered.map(t=>`<div class="song-card ${currentId===t.id?'active':''}" onclick="playTrack(${t.id})"><div class="song-art">${t.emoji}</div><div class="song-info-card"><div class="song-name-card">${t.title}</div><div class="song-artist-card">${t.artist}</div><div class="song-meta"><span class="duration">${formatTime(t.duration)}</span><button class="like-icon" onclick="event.stopPropagation();toggleLike(${t.id})">${likes.has(t.id)?'❤️':'♡'}</button></div></div></div>`).join('');}
function renderPlaylists(){let container=document.getElementById('playlistScroll');container.innerHTML=PLAYLISTS.map(p=>`<div class="playlist-card" onclick="loadPlaylist('${p.name}')"><div class="playlist-cover">${p.cover}</div><div class="playlist-info"><div class="playlist-name">${p.name}</div><div class="playlist-count">${p.count} canciones</div></div></div>`).join('');}
function loadPlaylist(name){if(name==='Rock Classics')queue=TRACKS.map(t=>t.id);else if(name==='Heavy Metal')queue=TRACKS.filter(t=>t.genre==='Heavy Metal').map(t=>t.id);else if(name==='Prog Journey')queue=TRACKS.filter(t=>t.genre==='Prog Rock').map(t=>t.id);else queue=TRACKS.slice(0,15).map(t=>t.id);queueIndex=0;playTrack(queue[0]);showToast(`📀 Cargando: ${name}`);}
function clearQueue(){queue=[currentId];queueIndex=0;updateQueueUI();showToast('🗑️ Cola limpiada');}
function onYouTubeIframeAPIReady(){player=new YT.Player('ytPlayer',{height:0,width:0,events:{onStateChange:e=>{if(e.data===YT.PlayerState.ENDED){if(isRepeat)player.seekTo(0);else nextTrack();}},onReady:()=>{player.setVolume(70);playTrack(0);}}});}
function startProgress(){setInterval(()=>{if(player&&player.getCurrentTime&&currentId!==null){let cur=player.getCurrentTime(),dur=TRACKS.find(t=>t.id===currentId).duration;document.getElementById('progressFill').style.width=(cur/dur)*100+'%';document.getElementById('currentTime').innerText=formatTime(cur);}},500);}
function initEvents(){document.getElementById('playPauseBtn').onclick=togglePlay;document.getElementById('nextBtn').onclick=nextTrack;document.getElementById('prevBtn').onclick=prevTrack;document.getElementById('shuffleBtn').onclick=toggleShuffle;document.getElementById('repeatBtn').onclick=toggleRepeat;document.getElementById('miniPlayPause').onclick=togglePlay;document.getElementById('miniPrev').onclick=prevTrack;document.getElementById('miniNext').onclick=nextTrack;document.getElementById('clearQueueBtn').onclick=clearQueue;document.getElementById('progressBar').onclick=(e)=>{let rect=e.currentTarget.getBoundingClientRect();let pct=(e.clientX-rect.left)/rect.width;let dur=TRACKS.find(t=>t.id===currentId).duration;player.seekTo(pct*dur);};document.getElementById('searchInput').oninput=(e)=>{search=e.target.value.toLowerCase();renderSongsGrid();};document.getElementById('settingsBtn').onclick=()=>document.getElementById('settingsModal').style.display='flex';document.getElementById('closeModal').onclick=()=>document.getElementById('settingsModal').style.display='none';document.querySelectorAll('.nav-item').forEach(item=>{item.onclick=()=>{let nav=item.dataset.nav;if(nav==='likes'){let likedIds=[...likes];if(likedIds.length)playTrack(likedIds[0]);else showToast('❤️ No hay favoritas');}}});}
// SPLASH SCREEN
setTimeout(()=>{document.getElementById('splashScreen').style.opacity='0';setTimeout(()=>{document.getElementById('splashScreen').style.display='none';document.getElementById('appContent').style.display='flex';},800);},2200);
let script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.appendChild(script);window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;
renderGenres();renderSongsGrid();renderPlaylists();initEvents();initQueue();startProgress();
let dummy=document.createElement('div');dummy.id='ytPlayer';dummy.style.display='none';document.body.appendChild(dummy);
</script>
</body>
</html>
